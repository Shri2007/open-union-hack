<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Open Union · Stage screen</title>
<style>
  :root {
    --bg: #07090f;
    --panel: #11151f;
    --line: #232a3a;
    --ink: #f2f5ff;
    --dim: #8d97b0;
    --good: #46d39a;
    --bad: #ff5f6d;
    --warn: #ffc24b;
    --accent: #6ea8ff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px 32px;
    background: var(--bg); color: var(--ink);
    font: 16px/1.4 ui-sans-serif, system-ui, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  header { display: flex; align-items: baseline; gap: 20px; flex-wrap: wrap; }
  h1 { font-size: 30px; margin: 0; letter-spacing: .5px; }
  .need { color: var(--dim); font-size: 22px; }
  .conn { margin-left: auto; font-size: 18px; color: var(--dim); }
  .conn.live { color: var(--good); }
  .conn.down { color: var(--bad); }

  .top { display: grid; grid-template-columns: minmax(360px, 1fr) 2fr; gap: 20px; margin-top: 20px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; }
  .panel h2 { font-size: 18px; text-transform: uppercase; letter-spacing: 2px; color: var(--dim); margin: 0 0 12px; }

  /* Scales with the projector, and keeps "$58.40/mo" on one line inside the panel. */
  .price { font-size: min(128px, 6.5vw); font-weight: 700; line-height: 1; white-space: nowrap; }
  .price small { font-size: 34px; color: var(--dim); font-weight: 500; }
  .terms { color: var(--dim); font-size: 20px; margin-top: 10px; min-height: 28px; }

  .stats { display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; }
  .stat { background: #0c101a; border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
  .stat .n { font-size: 64px; font-weight: 700; line-height: 1; }
  .stat .k { font-size: 16px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--dim); margin-top: 8px; }
  .stat.verified .n { color: var(--good); }
  .stat.removed .n { color: var(--bad); }
  .stat.simulated .n { color: var(--warn); }

  .tag {
    font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase;
    background: #3a2d08; color: var(--warn); border: 1px solid #6a5212;
    border-radius: 999px; padding: 2px 10px; margin-left: 8px; vertical-align: middle;
  }

  .grid { display: grid; grid-template-columns: 1.3fr 1fr; gap: 20px; margin-top: 20px; }
  .chart { width: 100%; height: 300px; }
  .chart text { fill: var(--dim); font-size: 14px; }

  .chat { max-height: 320px; overflow: hidden; display: flex; flex-direction: column-reverse; }
  .chat p { margin: 0 0 10px; font-size: 22px; }
  .who {
    font-size: 14px; text-transform: uppercase; letter-spacing: 1.5px;
    border-radius: 6px; padding: 2px 8px; margin-right: 10px; background: #1c2435; color: var(--dim);
  }
  .who.coalition { background: #11314a; color: var(--accent); }
  .who.vendor { background: #3a2a12; color: var(--warn); }
  .who.persona { background: #152f26; color: var(--good); }

  table { width: 100%; border-collapse: collapse; font-size: 20px; }
  th { text-align: left; font-size: 14px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--dim); padding-bottom: 8px; }
  td { padding: 6px 0; border-top: 1px solid var(--line); }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .p-high { color: var(--bad); font-weight: 700; }
  .p-low { color: var(--good); }
  .verdict { font-size: 22px; font-weight: 700; margin-top: 12px; }
  .verdict.reject { color: var(--bad); }
  .verdict.pass { color: var(--good); }
  .verdict.ask_member { color: var(--warn); }
  .empty { color: var(--dim); font-size: 18px; }
  .yes { color: var(--good); }
  .no { color: var(--bad); }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 17px; color: var(--dim); }
</style>
</head>
<body>

<header>
  <h1>Open Union</h1>
  <span class="need" id="need">phone plan under $60</span>
  <span class="conn" id="conn">connecting…</span>
</header>

<div class="top">
  <section class="panel">
    <h2>Vendor offer <span class="tag">simulated</span></h2>
    <div class="price" id="price">—</div>
    <div class="terms" id="terms">waiting for an offer</div>
  </section>

  <section class="panel">
    <h2>Members</h2>
    <div class="stats">
      <div class="stat verified"><div class="n" id="c-verified">0</div><div class="k">verified humans</div></div>
      <div class="stat"><div class="n" id="c-unverified">0</div><div class="k">unverified</div></div>
      <div class="stat removed"><div class="n" id="c-removed">0</div><div class="k">removed by Persona</div></div>
      <div class="stat"><div class="n" id="c-real">0</div><div class="k">real members</div></div>
      <div class="stat simulated"><div class="n" id="c-simulated">0</div><div class="k">simulated</div></div>
    </div>
  </section>
</div>

<div class="grid">
  <section class="panel">
    <h2>Offer price vs members</h2>
    <svg class="chart" id="chart" viewBox="0 0 800 300" preserveAspectRatio="none" role="img" aria-label="Offer price against member count"></svg>
  </section>

  <section class="panel">
    <h2>Chat</h2>
    <div class="chat" id="chat"><p class="empty">no messages yet</p></div>
  </section>
</div>

<div class="grid">
  <section class="panel">
    <h2>Trap check <span class="tag">sandbox</span></h2>
    <div id="trap"><p class="empty">no offer checked yet</p></div>
  </section>

  <section class="panel">
    <h2>Tally</h2>
    <div id="tally"><p class="empty">not closed yet</p></div>
  </section>
</div>

<script>
// Stage screen for Open Union (docs/CONTRACT.md). One file, no build step, no dependencies.
// It renders only the SSE events in the contract, and polls GET /coalitions/{id} for the
// authoritative counts, so /demo/reset (which clears simulated members and keeps real ones)
// is picked up without a reload.
//
// P11 (presenter hotkeys) extends this file: read `state`, call `render()` after changing it,
// and use `post(path)` for the /demo/* triggers. Nothing else here needs to move.

const COALITION_ID = new URLSearchParams(location.search).get("c") || "demo-phone-plan";
const COUNT_POLL_MS = 4000;

const state = {
  connected: false,
  need: "",
  offer: null,                 // { price_cents, terms_text }
  counts: { verified: 0, unverified: 0, removed: 0, real: 0, simulated: 0 },
  baseline: { verified: 0, unverified: 0, removed: 0, real: 0, simulated: 0 },  // last server snapshot
  delta: { verified: 0, unverified: 0, removed: 0, real: 0, simulated: 0 },     // events since that snapshot
  clients: new Map(),          // agent_id -> client, so a removal knows real from simulated
  chart: [],                   // [{ members, price_cents }]
  chat: [],                    // [{ who, text }]
  trap: null,                  // { questions, verdict, senso }
  tally: null                  // { accepted, total, revealed }
};

const $ = (id) => document.getElementById(id);
// Whole dollars read better from the back of a room, but cents are shown when an offer or a
// revealed limit has them, so $58.40 and $58.00 never look like the same number.
const dollars = (cents) => (cents / 100).toFixed(cents % 100 === 0 ? 0 : 2);
const isSimulated = (client) => client === "firedrill" || client === "simulated-attack";

function post(path) {
  return fetch(path, { method: "POST" });
}

// --- counts ------------------------------------------------------------
// The five numbers are the server's snapshot plus the member events seen since it was taken.
// The snapshot is the source of truth because /demo/reset drops the simulated members without
// emitting any event, and it must not take the real members down with them.
const COUNT_KEYS = ["verified", "unverified", "removed", "real", "simulated"];

let memberEventSeq = 0;  // bumped by every member event, so a stale snapshot can be spotted

function bump(key, by) {
  state.delta[key] += by;
  state.counts[key] = Math.max(0, state.baseline[key] + state.delta[key]);
}

async function pollCounts() {
  const seqAtRequest = memberEventSeq;
  try {
    const res = await fetch(`/coalitions/${encodeURIComponent(COALITION_ID)}`);
    if (!res.ok) return;
    const data = await res.json();
    state.need = data.need || state.need;
    // A member event that landed while the request was in flight may or may not be in this
    // snapshot, so keep the live numbers and take a fresh snapshot instead of going backwards.
    if (memberEventSeq !== seqAtRequest) return render();
    state.baseline = data.counts;
    for (const key of COUNT_KEYS) {
      state.delta[key] = 0;
      state.counts[key] = data.counts[key];
    }
    render();
  } catch (err) {
    // The relay may be restarting mid-demo. The next poll picks it up.
  }
}

// --- rendering ---------------------------------------------------------
function render() {
  $("conn").textContent = state.connected ? "live" : "reconnecting…";
  $("conn").className = "conn " + (state.connected ? "live" : "down");
  if (state.need) $("need").textContent = state.need;

  $("price").innerHTML = state.offer ? `$${dollars(state.offer.price_cents)}<small>/mo</small>` : "—";
  $("terms").textContent = state.offer ? state.offer.terms_text : "waiting for an offer";

  for (const key of ["verified", "unverified", "removed", "real", "simulated"]) {
    $("c-" + key).textContent = state.counts[key];
  }

  renderChart();
  renderChat();
  renderTrap();
  renderTally();
}

function renderChart() {
  const svg = $("chart");
  const pts = state.chart;
  if (pts.length === 0) {
    svg.innerHTML = `<text x="20" y="150">no offers yet</text>`;
    return;
  }
  const W = 800, H = 300, L = 70, R = 20, T = 20, B = 40;
  const xs = pts.map((p) => p.members);
  const ys = pts.map((p) => p.price_cents / 100);
  const xMax = Math.max(1, ...xs), yMax = Math.max(...ys), yMin = Math.min(...ys);
  const ySpan = Math.max(5, yMax - yMin);
  const yTop = yMax + ySpan * 0.15, yBot = Math.max(0, yMin - ySpan * 0.15);
  const x = (v) => L + (v / xMax) * (W - L - R);
  const y = (v) => T + (1 - (v - yBot) / (yTop - yBot)) * (H - T - B);

  const line = pts.map((p, i) => `${i ? "L" : "M"}${x(p.members).toFixed(1)},${y(p.price_cents / 100).toFixed(1)}`).join(" ");
  const dots = pts.map((p) => `<circle cx="${x(p.members).toFixed(1)}" cy="${y(p.price_cents / 100).toFixed(1)}" r="5" fill="#6ea8ff"/>`).join("");

  svg.innerHTML = `
    <line x1="${L}" y1="${H - B}" x2="${W - R}" y2="${H - B}" stroke="#232a3a" stroke-width="2"/>
    <line x1="${L}" y1="${T}" x2="${L}" y2="${H - B}" stroke="#232a3a" stroke-width="2"/>
    <text x="8" y="${(y(yTop) + 14).toFixed(1)}">$${yTop.toFixed(0)}</text>
    <text x="8" y="${(H - B).toFixed(1)}">$${yBot.toFixed(0)}</text>
    <text x="${L}" y="${H - 12}">0 members</text>
    <text x="${W - R - 110}" y="${H - 12}">${xMax} members</text>
    <path d="${line}" fill="none" stroke="#6ea8ff" stroke-width="4"/>
    ${dots}`;
}

function renderChat() {
  const box = $("chat");
  if (state.chat.length === 0) {
    box.innerHTML = `<p class="empty">no messages yet</p>`;
    return;
  }
  // Newest first: the column-reverse layout keeps the latest line at the bottom edge.
  box.innerHTML = state.chat.slice(-12).map((m) =>
    `<p><span class="who ${esc(m.who)}">${esc(m.who)}</span>${esc(m.text)}</p>`).reverse().join("");
}

function renderTrap() {
  const box = $("trap");
  if (!state.trap) {
    box.innerHTML = `<p class="empty">no offer checked yet</p>`;
    return;
  }
  const rows = (state.trap.questions || []).map((q) => {
    const high = q.p >= 0.30;
    return `<tr><td>${esc(q.q)}</td><td class="num ${high ? "p-high" : "p-low"}">${Number(q.p).toFixed(2)}</td></tr>`;
  }).join("");
  const cites = (state.trap.senso || []).length;
  box.innerHTML = `
    <table><thead><tr><th>question</th><th class="num">probability</th></tr></thead><tbody>${rows}</tbody></table>
    <div class="verdict ${esc(state.trap.verdict)}">${esc(state.trap.verdict)}</div>
    <p class="mono">${cites} Senso citation${cites === 1 ? "" : "s"} in the log</p>`;
}

function renderTally() {
  const box = $("tally");
  if (!state.tally) {
    box.innerHTML = `<p class="empty">not closed yet</p>`;
    return;
  }
  const offer = state.offer ? state.offer.price_cents : null;
  const rows = (state.tally.revealed || []).map((r) => {
    const accepts = offer !== null && r.ok && r.price_cents >= offer;
    return `<tr>
      <td class="mono">${esc(r.agent_id)}</td>
      <td class="num">$${dollars(r.price_cents)}</td>
      <td class="${r.ok ? "yes" : "no"}">${r.ok ? "match" : "mismatch"}</td>
      <td class="${accepts ? "yes" : "no"}">${accepts ? "yes" : "no"}</td>
    </tr>`;
  }).join("");
  box.innerHTML = `
    <div class="verdict pass">${state.tally.accepted} of ${state.tally.total} accepted</div>
    <table><thead><tr><th>pseudonym</th><th class="num">revealed</th><th>commitment</th><th>accepts</th></tr></thead>
    <tbody>${rows}</tbody></table>`;
}

function esc(v) {
  return String(v ?? "").replace(/[&<>"]/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch]));
}

// --- live events -------------------------------------------------------
const handlers = {
  member_joined(d) {
    memberEventSeq++;
    state.clients.set(d.agent_id, d.client);
    bump(d.verified ? "verified" : "unverified", 1);
    bump(isSimulated(d.client) ? "simulated" : "real", 1);
  },
  member_removed(d) {
    memberEventSeq++;
    // Persona removes members whose inquiry never passed, so a removal comes out of "unverified".
    bump("removed", 1);
    bump("unverified", -1);
    const client = state.clients.get(d.agent_id);
    if (client) bump(isSimulated(client) ? "simulated" : "real", -1);
  },
  offer(d) {
    state.offer = { price_cents: d.price_cents, terms_text: d.terms_text };
    state.chart.push({ members: state.counts.verified + state.counts.unverified, price_cents: d.price_cents });
  },
  trap_check(d) {
    state.trap = { questions: d.questions || [], verdict: d.verdict, senso: d.senso || [] };
  },
  chat(d) {
    state.chat.push({ who: d.who, text: d.text });
  },
  tally(d) {
    state.tally = { accepted: d.accepted, total: d.total, revealed: d.revealed || [] };
  }
};

function connect() {
  const source = new EventSource(`/stream?coalition_id=${encodeURIComponent(COALITION_ID)}`);
  source.onopen = () => { state.connected = true; render(); };
  source.onerror = () => { state.connected = false; render(); };  // EventSource retries on its own
  for (const [name, handle] of Object.entries(handlers)) {
    source.addEventListener(name, (ev) => {
      try { handle(JSON.parse(ev.data)); } catch (err) { return; }
      render();
    });
  }
  return source;
}

render();
pollCounts();
setInterval(pollCounts, COUNT_POLL_MS);
if (typeof EventSource !== "undefined") connect();
</script>
</body>
</html>
