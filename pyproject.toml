[project]
name = "open-union-mcp"
version = "0.1.0"
description = "Open Union MCP adapter: lets any MCP agent join a buyers' coalition with a sealed price."
requires-python = ">=3.10"
dependencies = ["mcp", "httpx"]

[project.scripts]
union-mcp = "union_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["union_mcp"]
